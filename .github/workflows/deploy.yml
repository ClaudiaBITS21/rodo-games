name: Publicar en Firebase

# Cada push a main publica la web (Hosting) y las reglas e índices de Firestore.
# Autenticación sin claves: GitHub demuestra su identidad a Google (Workload Identity Federation)
# y recibe un permiso temporal para actuar como github-deploy@rodo-games. No hay secretos guardados.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticación con Google (sin claves)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/150328029178/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@rodo-games.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore --project rodo-games --non-interactive

      # Verifica que el sitio publicado responda y sea exactamente la versión de este commit
      - name: Verificar el sitio publicado
        run: |
          want=$(sha256sum public/index.html | cut -d' ' -f1)
          for url in https://games.rodo.es/ https://rodo-games.web.app/; do
            ok=""
            for i in $(seq 1 12); do
              got=$(curl -fsS --compressed -H 'Cache-Control: no-cache' "$url?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1) || got=""
              if [ "$got" = "$want" ]; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then echo "::error::$url no sirve la versión de este commit"; exit 1; fi
            echo "✔ $url responde con la versión de este commit"
          done
          curl -fsS https://games.rodo.es/__/firebase/init.json | grep -q '"projectId": *"rodo-games"' \
            && echo "✔ configuración de Firebase disponible" \
            || { echo "::error::no responde /__/firebase/init.json"; exit 1; }
