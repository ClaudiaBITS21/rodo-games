// =====================================================================
// PUNTAJE: tiempo ajustado = tiempo + 10 s por error (20 s en el ahorcado) + 60 s por ayuda + 5 s por cada "Comprobar"
// + (15 min / rondas) por ronda fallada.
// Puntos = 100 por resolverla + (900 − segundos ajustados, mínimo 0). Sin resolver: 0.
// Los resultados viejos no tienen "e": en ahorcado y semilla "h" eran errores; en el resto, ayudas.
// =====================================================================
const SOPA_N={chica:10, media:12, grande:15};   // lado de la grilla de cada tamaño de sopa
const SCORE={ERR:10, HINT:60, CHECK:5, CAP:900, BONUS:100, HELP_LOCK:7*60000, ROUNDS:{anagrama:10, placa:10, esbip:20}};
const errCost=k=> k==="ahorcado" ? 20 : SCORE.ERR;
const roundCost=k=> SCORE.ROUNDS[k] ? SCORE.CAP/SCORE.ROUNDS[k] : 0;
// segundos de penalidad: e errores, h ayudas, c comprobaciones, r rondas falladas
const penSecs=(k,e,h,c,r)=> e*errCost(k) + h*SCORE.HINT + c*SCORE.CHECK + r*roundCost(k);
function scoreOf(k, r){
  let e=r.e, h=r.h||0;
  if(e===undefined){ if(k==="ahorcado"||k==="semilla"){ e=h; h=0; } else e=0; }
  const R=SCORE.ROUNDS[k], fails=R ? Math.max(0, R-(r.s||0)) : 0;
  const pen=penSecs(k, e, h, r.c||0, fails);
  const adj=(r.ms||0)/1000 + pen, ok=R ? (r.s||0)>0 : !!r.ok;
  return {e, h, c:r.c||0, fails, pen, adj, ok, pts: ok ? SCORE.BONUS + Math.max(0, Math.round(SCORE.CAP-adj)) : 0};
}
// Duelo: quién ganó una partida. a y b son los resultados de cada uno (o undefined si no terminó).
// timedOut: pasaron más de 15 minutos desde que se creó la partida. Devuelve "a", "b", "tie", "void" o null (en juego).
function duelWinner(k, a, b, timedOut){
  if(a && b){
    const x=scoreOf(k,a), y=scoreOf(k,b);
    if(!x.ok && !y.ok) return "tie";
    const d=((x.ok?1:0)-(y.ok?1:0))||(x.pts-y.pts)||(y.adj-x.adj);
    return d>0 ? "a" : d<0 ? "b" : "tie";
  }
  if(!timedOut) return null;
  return a ? "a" : b ? "b" : "void";
}
const Reg = (()=>{

    KEYS.forEach(g=>{ const u=ui[g]; if(!u) return;
      if(u.gate){ u.gateBtn.textContent=t.gateGo; u.gateNote.textContent=t.gateNote; }
      u.go.textContent=t.rkGo; u.rkBtn.textContent=t.rkBtn; u.input.setAttribute("aria-label",t.rkNum); u.jump.textContent=t.rkJump; u.x.setAttribute("aria-label",t.rkClose);
      setPid(g); setCost(g); renderRank(g); });
  }
  // apodos únicos: nicks/{apodo en minúsculas} guarda de quién es; se escribe junto con names/{uid}
  const nickKey=v=>v.toLowerCase();
  // opt: {av: avatar, ver: versión del PIN (la escribe el módulo de usuario al vincular nombre + PIN)}
  async function setNick(v, opt={}){
    v=String(v||"").trim().replace(/\s+/g," ").slice(0,24).trim(); if(!v||!fb) return "fail";
    if(v.includes("/")||/^\.+$/.test(v)||/^__.*__$/.test(v)) return "bad";
    const key=nickKey(v), ref=fb.doc(fb.db,"nicks",key);
    try{
      const s=await fb.getDoc(ref);
      if(s.exists() && s.data().uid!==uid) return "taken";
      const b=fb.writeBatch(fb.db), a=opt.av||myAv;
      b.set(fb.doc(fb.db,"names",uid), a ? {name:v, av:a} : {name:v});
      if(!s.exists() || opt.ver) b.set(ref, opt.ver ? {uid, v:opt.ver} : {uid});
      // libera el apodo anterior, si era suyo
      if(nick && nickKey(nick)!==key){
        const o=await fb.getDoc(fb.doc(fb.db,"nicks",nickKey(nick)));
        if(o.exists() && o.data().uid===uid) b.delete(o.ref);
      }
      await b.commit();
      nick=v; names[uid]=v; if(a){ myAv=a; avs[uid]=a; store.set("rodo-av",a); } store.set("rodo-nick",v); KEYS.forEach(renderRank); return "ok";
    }catch(e){ return "fail"; }
  }
  const nickMsg=r=>({ok:T[lang].rkNickSaved, taken:T[lang].rkNickTaken, bad:T[lang].rkNickBad}[r]||T[lang].rkFail);
  // el apodo guardado manda sobre el del navegador; si todavía no estaba reservado, se reserva
  async function loadNick(){
    try{
      const s=await fb.getDoc(fb.doc(fb.db,"names",uid));
      nick = s.exists() ? s.data().name : ""; store.set("rodo-nick",nick); if(nick) names[uid]=nick;
      myAv = s.exists() ? (s.data().av||"") : ""; store.set("rodo-av",myAv); if(myAv) avs[uid]=myAv;
      if(nick){ const r=await fb.getDoc(fb.doc(fb.db,"nicks",nickKey(nick))); if(!r.exists()) await setNick(nick); }
    }catch(e){}
  }

  function localGame(g, note){ cur[g]={lang, k:kid(g), n:null}; closeWin(g); GAMES[g].load(GAMES[g].gen()); setPid(g); startT(g); msg(g,note); }

  // force: el usuario cambió el idioma a propósito (pasa a una partida del idioma nuevo)
  async function enter(g, force){
    const c=cur[g];
    if(c && c.k===kid(g) && (c.lang===lang || (!force && (going(g) || c.fz)))){ thaw(g); return; }
    cur[g]={lang, k:kid(g), n:null, loading:true}; setPid(g); msg(g,"");
    await ready;
    if(!fb) return localGame(g, T[lang].rkLocal);
    await next(g);
  }
  // "Nuevo": la primera partida existente que este jugador todavía no vio; si las vio todas, una nueva
  async function newGame(g){ if(busy) return; await ready; if(!fb) return localGame(g, T[lang].rkLocal); await next(g); }
  async function next(g){
    const k=kid(g), L=lang;
    try{
      const s=await fb.getDoc(fb.doc(fb.db,"counters",`${k}-${L}`));
      const count = s.exists() ? (s.data().count||0) : 0, saw=new Set(seen[`${k}-${L}`]||[]);
      for(let n=1;n<=count;n++) if(!saw.has(n)) return await open(g,n);
      await fresh(g);
    }catch(e){ localGame(g, T[lang].rkLocal); }
  }
  async function fresh(g){
    if(busy) return; busy=true;
    const L=lang, k=kid(g), d=GAMES[g].gen(), key=`${k}-${L}`;
    try{
      await ready;
      if(!fb){ cur[g]={lang:L,k,n:null}; closeWin(g); GAMES[g].load(d); setPid(g); startT(g); msg(g,T[lang].rkLocal); return; }
      cur[g]={lang:L, k, n:null, loading:true}; setPid(g); msg(g,"");
      const n = await mkPuzzle(k, L, d);
      cur[g]={lang:L, k, n}; closeWin(g); GAMES[g].load(d); setPid(g); startT(g); markSeen(k,L,n,d); watch(g);
    }catch(e){
      cur[g]={lang:L,k,n:null}; closeWin(g); GAMES[g].load(d); setPid(g); startT(g); msg(g, T[lang].rkFailNew);
    } finally { busy=false; }
  }
  // transacción: el contador y la partida se escriben juntos, sin números repetidos
  function mkPuzzle(k, L, d){
    const key=`${k}-${L}`;
    return fb.runTransaction(fb.db, async tx=>{
      const cref=fb.doc(fb.db,"counters",key);
      const s=await tx.get(cref);
      const n=(s.exists()?(s.data().count||0):0)+1;
      if(s.exists()) tx.update(cref,{count:n}); else tx.set(cref,{count:1});
      tx.set(fb.doc(fb.db,"puzzles",`${key}-${n}`),{game:k, lang:L, n, data:d, by:uid, at:fb.serverTimestamp()});
      return n;
    });
  }
  // partida nueva para una invitación: se crea sin abrirla (se abre cuando el otro acepta)
  // opt (sopa): {s: tamaño, m: modo}
  // opt: {L: idioma, s: tamaño de sopa, m: modo de sopa, w: palabras de la semilla}
  async function inviteGame(g, opt={}){
    await ready; if(!fb) throw new Error("offline");
    const k=opt.s ? (opt.s==="media" ? "sopa" : "sopa"+opt.s) : kid(g), L=opt.L||lang;
    // la partida se genera en el idioma elegido aunque la página esté en otro
    await loadClueUse(L);
    const prev=lang; lang=L; CLUES.duel=true; CLUES.trimWords=g!=="acrostico";
    let d; try{ d=GAMES[g].gen(g==="semilla" ? opt.w : opt.s); } finally { lang=prev; CLUES.duel=false; CLUES.trimWords=false; }
    const r={g, k, lang:L, n: await mkPuzzle(k, L, d)};
    if(opt.m) r.m=opt.m; if(opt.w) r.w=opt.w;
    return r;
  }
  // abrir la partida de una invitación; duel: el duelo al que pertenece
  async function playInvite(g, k, n, duel, m){
    if(GAMES[g].setKey) GAMES[g].setKey(k);
    if(m && GAMES[g].setMode) GAMES[g].setMode(m);
    cur[g]={lang, k, n:null, loading:true}; setPid(g);
    if(location.hash!=="#"+g) location.hash=g;
    await open(g, n);
    if(cur[g] && cur[g].n===n && duel){ cur[g].duel=duel; setCost(g); }
  }
  // un lugar propio dentro del cartel final (duelo, retomar partida)
  function slot(g, cls){
    const u=ui[g]; let el=u.win.querySelector("."+cls);
    if(!el){ el=document.createElement("div"); el.className=cls; u.win.insertBefore(el, u.rk); }
    return el;
  }
  async function open(g,n){
    await ready; if(!fb) return;
    const L=lang, k=kid(g);
    try{
      const s=await fb.getDoc(fb.doc(fb.db,"puzzles",`${k}-${L}-${n}`));
      if(!s.exists()){ msg(g, T[lang].rkNotFound(n)); if(cur[g]&&cur[g].loading) await fresh(g); return; }
      const d=JSON.parse(JSON.stringify(s.data().data));
      cur[g]={lang:L, k, n}; closeWin(g); GAMES[g].load(d); setPid(g); setCost(g); startT(g); msg(g,""); ui[g].input.value=""; ui[g].find.hidden=true; markSeen(k,L,n,d); watch(g);
    }catch(e){ msg(g, T[lang].rkNotFound(n)); }
  }
  function watch(g){
    if(subs[g]){ subs[g](); subs[g]=null; }
    const c=cur[g]; if(!fb||!c||!c.n) return;
    const id=`${c.k}-${c.lang}-${c.n}`;
    subs[g]=fb.onSnapshot(fb.collection(fb.db,"scores",id,"players"), qs=>{
      if(cur[g]!==c) return;
      const sc={}; qs.forEach(d=>sc[d.id]=d.data()); c.scores=sc;
      if(uid && sc[uid] && !c.notified){ c.notified=true; if(!c.justSaved) msg(g, T[lang].rkPlayed); }
      renderRank(g);
    }, ()=>{});
  }
  async function finish(g, rec){
    const c=cur[g]; if(c && c.t0 && !c.t1){ c.t1=Date.now(); tick(); }
    if(c){ rec.e=c.e||0; rec.h=c.h||0; rec.c=c.c||0; }
    if(GAMES[g].mode) rec.m=GAMES[g].mode();
    if(ui[g]){ ui[g].win.classList.remove("rkonly"); showPts(g, rec); showLearn(g); }
    showBack(g);
    if(c && c.duel && c.n && Reg.onDuel) Reg.onDuel(g, c.duel, `${c.k}-${c.lang}-${c.n}`);
    else if(ui[g]){ const el=ui[g].win.querySelector(".wduel"); if(el) el.hidden=true; }
    if(!fb||!c||!c.n||!uid) return;
    const ref=fb.doc(fb.db,"scores",`${c.k}-${c.lang}-${c.n}`,"players",uid);
    try{
      const s=await fb.getDoc(ref);
      if(s.exists()) msg(g, T[lang].rkPlayed);
      else{
        c.justSaved=true; c.notified=true;
        const doc1={g:c.k, ok:!!rec.ok, s:rec.s||0, h:rec.h||0, e:rec.e||0, c:rec.c||0, ms:Math.max(1000,Math.round(rec.ms)), at:fb.serverTimestamp()};
        if(rec.m) doc1.m=rec.m;
        await fb.setDoc(ref,doc1);
        fb.setDoc(fb.doc(fb.db,"fichas",uid),{last:fb.serverTimestamp(), plays:{[`${c.k}-${c.lang}`]:fb.increment(1)}},{merge:true}).catch(()=>{});
        msg(g, T[lang].rkSaved);
      }
    }catch(e){ msg(g, T[lang].rkFail); }
    Object.keys(gcache).forEach(x=>{ if(x.startsWith(c.k)) delete gcache[x]; }); ui[g].rk.hidden=false; renderRank(g);
  }
  function showPts(g, rec){
    const u=ui[g], t=T[lang], c=cur[g], sc=scoreOf(c?c.k:g, rec);
    if(!u.pts){ u.pts=document.createElement("div"); u.pts.className="wpts"; const st=u.win.querySelector(".stats"); u.win.insertBefore(u.pts, st?st.nextSibling:u.rk); }
    u.pts.innerHTML=`<b>${esc(t.ptsLine(sc.pts))}</b><span>${esc(t.ptsDetail(fmt(rec.ms), sc.pen?fmt(sc.pen*1000):""))}</span>`;
  }
  // al terminar (ganando o perdiendo): "¿Aprendiste alguna palabra nueva?" para medir si el juego enseña
  function showLearn(g){
    const c=cur[g], el=slot(g,"wlearn"), t=T[lang];
    el.hidden=!(fb && c && c.n); if(el.hidden) return;
    const pid=`${c.k}-${c.lang}-${c.n}`;
    el.innerHTML=`<p>${esc(t.learnQ)}</p><label><input type="checkbox"> ${esc(t.learnYes)}</label><span class="lnote" aria-live="polite"></span>`;
    el.querySelector("input").addEventListener("change",async e=>{
      const note=el.querySelector(".lnote");
      try{
        await fb.setDoc(fb.doc(fb.db,"learned",`${uid}_${pid}`),{u:uid, p:pid, g:c.k, yes:e.target.checked, duel:!!c.duel, at:fb.serverTimestamp()});
        note.textContent=e.target.checked ? t.learnThanks : "";
      }catch(err){ note.textContent=t.rkFail; }
    });
  }
  // si quedó otra partida congelada (por una invitación), pregunta si la retoma
  function showBack(g){
    const u=ui[g]; if(!u) return;
    const el=slot(g,"wback"), b=KEYS.find(x=>x!==g && cur[x] && cur[x].fz);
    el.hidden=!b; if(!b) return;
    el.innerHTML=`<p>${esc(T[lang].ivBackQ(gameName(b)))}</p><button>${esc(T[lang].ivBackGo)}</button>`;
    el.querySelector("button").addEventListener("click",()=>{ closeWin(g); el.hidden=true; location.hash=b; });
  }
  async function loadNames(ids){
    const miss=ids.filter(i=>!(i in names));
    await Promise.all(miss.map(async i=>{
      try{ const s=await fb.getDoc(fb.doc(fb.db,"names",i)); names[i]= s.exists() ? s.data().name : ""; avs[i]= s.exists() ? (s.data().av||"") : ""; }catch(e){ names[i]=""; }
    }));
  }
  const online=()=>!!fb;
  const nickName=()=>nick;
  // el apodo se elige en "Elegí tu usuario" (con PIN); acá solo se muestra o se ofrece elegirlo
  const nickHtml=()=> nick ? `<p class="m small">${esc(T[lang].uPlaying(myAv||"🙂", nick))}</p>` : `<div class="nick"><button class="nickopen">${esc(T[lang].rkUserBtn)}</button></div>`;
  async function fetchAll(g){
    const qs=await fb.getDocs(fb.query(fb.collectionGroup(fb.db,"players"), fb.where("g","==",kid(g))));
    // en la sopa, cada modo (palabras o pistas) tiene su propio ranking
    const md=GAMES[g].mode ? GAMES[g].mode() : null;
    return qs.docs.filter(d=>!testers.has(d.id) && (!md || (d.data().m||"w")===md)).map(d=>({p:d.ref.parent.parent.id, u:d.id, r:d.data()}));
  }
  // ---------- Puntaje por partida (con tope) y ranking general por percentil ----------
  const MINP=10;                     // partidas comparables necesarias para el ranking general
  // más puntos gana; con los mismos puntos, menos tiempo ajustado
  const cmp=(x,y)=>{ const a=scoreOf(x.g,x), b=scoreOf(y.g,y); return ((b.ok?1:0)-(a.ok?1:0))||(b.pts-a.pts)||(a.adj-b.adj); };
  function metric(g,r){
    const t=T[lang], sc=scoreOf(r.g||kid(g), r), R=SCORE.ROUNDS[r.g||kid(g)];
    return `${t.ptsShort(sc.pts)} · ${R?`${r.s}/${R}, `:""}${fmt(r.ms)}${sc.pen?` + ${fmt(sc.pen*1000)}`:""}`;
  }
  // entries: [{p: partida, u: jugador, r: resultado}] → por jugador: partidas jugadas, comparables y suma de percentiles
  function percentiles(entries){
    const byP={}, acc={};
    entries.forEach(e=>{ (byP[e.p]=byP[e.p]||[]).push(e); (acc[e.u]=acc[e.u]||{played:0,n:0,sum:0}).played++; });
    Object.values(byP).forEach(list=>{
      const N=list.length; if(N<2) return;
      list.forEach(e=>{
        let beat=0, tie=0;
        list.forEach(o=>{ if(o===e) return; const c=cmp(e.r,o.r); if(c<0) beat++; else if(c===0) tie++; });
        acc[e.u].n++; acc[e.u].sum += (beat+0.5*tie)/(N-1);
      });
    });
    return acc;
  }
  const gcache={};
  async function allResults(g){
    const k=kid(g)+(GAMES[g].mode?GAMES[g].mode():""), c=gcache[k]; if(c && Date.now()-c.at<60000) return c.entries;
    const entries=await fetchAll(g); gcache[k]={at:Date.now(), entries}; return entries;
  }
  const nmOf=i=>{ const t=T[lang], nk=nickName(), a=avs[i] ? avs[i]+" " : ""; return i===uid ? (nk ? `${a}${nk} (${t.rkYou.toLowerCase()})` : t.rkYou) : (names[i] ? a+names[i] : t.rkSomeone); };
  async function renderRank(g){
    const u=ui[g], c=cur[g], t=T[lang]; if(!u||u.rk.hidden) return;
    const tab=u.tab||"p";
    u.tabs.forEach(b=>{ b.textContent = b.dataset.t==="g" ? t.rkTabG : t.rkTabP; b.setAttribute("aria-pressed", b.dataset.t===tab); });
    if(tab==="g") return renderGlobal(g);
    if(!online()||!c||!c.n){ u.body.innerHTML=`<p class="m">${esc(t.rkLocal)}</p>`; return; }
    const md=GAMES[g].mode ? GAMES[g].mode() : null;
    const sc=c.scores||{}, ids=Object.keys(sc).filter(counts).filter(i=>!md || (sc[i].m||"w")===md);
    const ok=ids.filter(i=>sc[i].ok).sort((a,b)=>cmp(sc[a],sc[b]));
    await loadNames(ok.slice(0,5));
    if(cur[g]!==c || (u.tab||"p")!=="p") return;
    let h=`<h3>${esc(t.rkTitle(gameName(g), c.n))}</h3>`;
    if(!ok.length) h+=`<p class="m">${esc(t.rkEmpty)}</p>`;
    else h+=`<ol>${ok.slice(0,5).map(i=>`<li class="${i===uid?"me":""}"><span>${esc(nmOf(i))}</span><span class="m">${esc(metric(g,sc[i]))}</span></li>`).join("")}</ol>`;
    const p=ok.indexOf(uid); if(p>=5) h+=`<p class="m">${esc(t.rkYourPos(p+1, metric(g,sc[uid])))}</p>`;
    if(uid && sc[uid] && !sc[uid].ok) h+=`<p class="m">${esc(t.rkYouFailed)}</p>`;
    if(ids.length) h+=`<p class="m">${esc(t.rkPlayers(ids.length))}</p>`;
    h+=`<p class="m small">${esc(t.rkScoreHow)}</p>`+nickHtml();
    u.body.innerHTML=h;
  }
  async function renderGlobal(g){
    const u=ui[g], t=T[lang];
    if(!online()){ u.body.innerHTML=`<p class="m">${esc(t.rkLocal)}</p>`; return; }
    u.body.innerHTML=`<p class="m">${esc(t.rkLoading)}</p>`;
    let entries;
    try{ entries=await allResults(g); }catch(e){ u.body.innerHTML=`<p class="m">${esc(t.rkFail)}</p>`; return; }
    const acc=percentiles(entries);
    const rows=Object.entries(acc).filter(([,a])=>a.n>=MINP).map(([id,a])=>({id, avg:a.sum/a.n, n:a.n})).sort((a,b)=>(b.avg-a.avg)||(b.n-a.n));
    await loadNames(rows.slice(0,5).map(r=>r.id));
    if((u.tab||"p")!=="g") return;
    let h=`<h3>${esc(t.rkGenTitle(gameName(g)))}</h3>`;
    if(!rows.length) h+=`<p class="m">${esc(t.rkGenEmpty(MINP))}</p>`;
    else h+=`<ol>${rows.slice(0,5).map(r=>`<li class="${r.id===uid?"me":""}"><span>${esc(nmOf(r.id))}</span><span class="m">${esc(t.rkPct(Math.round(r.avg*100), r.n))}</span></li>`).join("")}</ol>`;
    const mine=uid && acc[uid];
    if(mine){
      const pos=rows.findIndex(r=>r.id===uid);
      if(pos>=5) h+=`<p class="m">${esc(t.rkYourPos(pos+1, t.rkPct(Math.round(rows[pos].avg*100), rows[pos].n)))}</p>`;
      else if(pos<0) h+=`<p class="m">${esc(t.rkGenMissing(MINP-mine.n, mine.n?Math.round(mine.sum/mine.n*100):null))}</p>`;
    }
    h+=`<p class="m small">${esc(t.rkGenHow(MINP))}</p>`+nickHtml();
    u.body.innerHTML=h;
  }
  mount();
  return {enter, newGame, open, finish, texts, wait, pen,
    ready, fb:()=>fb, uid:()=>uid, nick:()=>nick, av:()=>myAv, isTester:()=>testers.has(uid),
    setTester:on=>{ if(on) testers.add(uid); else testers.delete(uid); document.body.classList.toggle("tester",on); Object.keys(gcache).forEach(k=>delete gcache[k]); }, setNick, nickMsg, gameName, busyList, freeze, thaw, inviteGame, restartClock, canHelp, playing:g=>going(g), say:(g,s)=>msg(g,s), playInvite, slot, cur:g=>cur[g], onDuel:null};
})();

// =====================================================================
// CONECTADOS E INVITACIONES
// Cada navegador avisa "estoy acá" cada minuto mientras la pestaña está a la vista (colección online).
// La invitación lleva una partida recién creada, así ninguno de los dos la jugó antes (colección invites).
// =====================================================================
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
Object.assign(T.es,{

Object.assign(T.en,{
  liveN:n=> n<=1 ? "Just you for now" : `${n} online now`,
  ivBtn:"Invite to play", ivRecv:"Receive invitations", ivClose:"Close",
  ivOutT:"What do you want to play?", ivNick:"Your nickname:", ivSend:"Invite",
  ivNeedNick:"Pick a nickname: it's what the other person will see.",
  ivSearching:"Looking for someone…", ivNobody:"Nobody is available to invite right now. Try again soon.",
  ivSomeone:"a player", ivWaitT:who=>`Waiting for ${who}…`, ivSecs:s=>`Expires in ${s}s`, ivCancel:"Cancel",
  ivYesOut:who=>`${cap(who)} accepted! Let's play.`, ivNoOut:who=>`${cap(who)} declined this time.`,

  ivLangL:"Language", ivLangName:{es:"Spanish",en:"English"}, ivIn:{es:"in Spanish",en:"in English"},
  ivWordsL:"Words", ivSize:n=>`${n}×${n}`, ivWithClues:"with clues", ivWithWords:"showing the words", ivWords:n=>`with ${n} words`,
  ivDesc:(g,p)=>`${g} ${p.join(", ")}`.trim(), ivBackPick:"← Pick another game",
  learnQ:"Did you learn a new word?", learnYes:"Yes, I learned something", learnThanks:"Noted, thanks!",
  ivBackQ:g=>`Your ${g} game is paused. Pick it back up?`, ivBackGo:"Resume my game",

  ivAway:who=>`${cap(who)} isn't available right now.`,
  duTitle:who=>`Duel with ${who}`, duScore:(w,l,who)=>`You ${w} – ${l} ${who}`, duTies:n=>` · ${n} tie${n>1?"s":""}`,
  duPlayed:n=>`${n} game${n>1?"s":""}`, duWaitOpp:who=>`${cap(who)} is still playing…`,
  duWon:"You won this one!", duLost:who=>`${cap(who)} won this one.`, duTie:"This one was a tie.", duVoid:"This one didn't count.",
  duRematch:"Rematch: pick the game", duTheirPick:who=>`It's ${who}'s turn to pick the rematch.`

const Live = (()=>{
  const WIN=60000, BEAT=60000, FRESH=150000, COUNT=30000;
  const PICK=["acrostico","ahorcado","sopa","criptograma","anagrama","semilla"];
  let fb=null, uid=null, off=0, synced=false, sentLang=null;
  let want=store.get("rodo-inv")!=="0";
  let pickG=null, game=null, tried=new Set(), out=null, inc=null, direct=null, pickS="media", pickM="w", pickL="es", pickW=12;
  const now=()=>Date.now()+off;            // hora del servidor, estimada
  const dOut=$("ivOut"), dIn=$("ivIn");
  const anyOpen=()=>dOut.open||dIn.open;
  const t=()=>T[lang];

  // ---------- conectados ----------
  const fresh=()=>fb.query(fb.collection(fb.db,"online"), fb.where("at",">",fb.Timestamp.fromMillis(now()-FRESH)));
  const avail=()=>want && !inc && !out && document.visibilityState==="visible";
  async function beat(){
    if(!fb) return;
    const ref=fb.doc(fb.db,"online",uid);
    if(document.visibilityState!=="visible"){ fb.deleteDoc(ref).catch(()=>{}); return; }
    try{
      sentLang=lang;
      await fb.setDoc(ref,{at:fb.serverTimestamp(), lang, inv:avail(), busy:Reg.busyList()});
      if(!synced){ const s=await fb.getDoc(ref), at=s.data().at; if(at){ off=at.toMillis()-Date.now(); synced=true; } }
    }catch(e){}
  }
  async function count(){
    if(!fb || view!=="menu" || document.visibilityState!=="visible") return;
    try{
      const n=(await fb.getCountFromServer(fresh())).data().count;
      $("liveN").textContent=t().liveN(Math.max(1,n)); $("live").hidden=false;
    }catch(e){}
  }

  // ---------- quien invita ----------
  const msgOut=s=>{ $("ivOutMsg").textContent=s||""; };
  function stage(s){
    $("ivPick").hidden=s!=="pick"; $("ivOpts").hidden=s!=="opts"; $("ivWait").hidden=s!=="wait"; $("ivDone").hidden=s!=="done";
    $("ivOutT").textContent = s==="pick" ? (direct ? t().ivRematchT(direct.who) : t().ivOutT) : cap(describe(curOpts()));
    $("ivAgain").hidden=!!direct;
  }
  // lo que se elige: juego, idioma y, si corresponde, tamaño y modo (sopa) o cantidad de palabras (semilla)
  const curOpts=()=> game ? {g:game.g, k:game.k, lang:game.lang, m:game.m, w:game.w} :
    {g:pickG, lang:pickL, k:pickG==="sopa" ? (pickS==="media"?"sopa":"sopa"+pickS) : pickG, m:pickG==="sopa"?pickM:undefined, w:pickG==="semilla"?pickW:undefined};
  function renderPick(){
    const games=PICK.filter(g=>!HIDDEN.has(g));
    if(!games.includes(pickG)) pickG=games[0];
    $("ivGames").innerHTML=games.map(g=>`<button data-g="${g}">${T[lang].gName[g]}</button>`).join("");
    renderOpts();
  }
  // segundo paso: las opciones del juego elegido (la otra persona juega exactamente eso)
  function renderOpts(){
    const T0=t(), seg=(label,items)=>`<div class="seg" role="group" aria-label="${label}">${items.map(([k,v,on,txt])=>`<button data-${k}="${v}" aria-pressed="${on}">${txt}</button>`).join("")}</div>`;
    let o=seg(T0.ivLangL, ["es","en"].map(L=>["l",L,L===pickL,T0.ivLangName[L]]));
    if(pickG==="sopa") o+=seg(T0.sSizeL, ["chica","media","grande"].map(s=>["s",s,s===pickS,`${T0.sSize[s]} ${SOPA_N[s]}×${SOPA_N[s]}`]))+
      seg(T0.sModeL, ["w","c"].map(m=>["m",m,m===pickM,m==="w"?T0.sList:T0.sListClue]));
    if(pickG==="semilla") o+=seg(T0.ivWordsL, [12,24].map(w=>["w",w,w===pickW,T0.pSize(w)]));
    $("ivSopa").innerHTML=o;
    $("ivNickRow").hidden=!!Reg.nick();
  }
  // dir: revancha con alguien en particular {to, who, d}
  function openOut(dir){
    if(!fb || anyOpen()) return;
    direct=dir&&dir.to ? dir : null;
    pickS=GAMES.sopa.size(); pickM=GAMES.sopa.mode(); pickL=lang; pickW=12;
    game=null; tried=new Set(); msgOut(""); stage("pick"); renderPick(); $("ivSend").disabled=false;
    dOut.showModal();
  }
  async function candidate(g){
    if(direct){
      const s=await fb.getDoc(fb.doc(fb.db,"online",direct.to)), x=s.exists()&&s.data();
      return x && x.at && x.at.toMillis()>now()-FRESH && x.inv && !(x.busy||[]).includes(g) ? direct.to : null;
    }
    const s=await fb.getDocs(fresh());
    const list=s.docs.filter(d=>{ const x=d.data(); return d.id!==uid && x.inv && !(x.busy||[]).includes(g) && !tried.has(d.id); }).map(d=>d.id);
    return list.length ? list[Math.floor(Math.random()*list.length)] : null;
  }
  async function send(){
    if(out) return;
    if(!Reg.nick()){ msgOut(t().ivNeedNick); User.open(); return; }
    $("ivSend").disabled=true; $("ivAgain").disabled=true; msgOut(t().ivSearching);
    try{
      const g=game ? game.g : pickG, to=await candidate(g);
      if(!to){ msgOut(direct ? t().ivAway(direct.who) : t().ivNobody); stage(game?"done":"opts"); return; }
      // la partida nueva se crea una sola vez: si alguien no acepta, se invita a otro con la misma
      if(!game) game=await Reg.inviteGame(g, {L:pickL, s:g==="sopa"?pickS:undefined, m:g==="sopa"?pickM:undefined, w:g==="semilla"?pickW:undefined});
      const ns=direct ? null : await fb.getDoc(fb.doc(fb.db,"names",to)).catch(()=>null);
      const who=direct ? direct.who : (ns && ns.exists() && ns.data().name) || t().ivSomeone;
      const inv={to, name:Reg.nick(), g:game.g, k:game.k, lang:game.lang, n:game.n, at:fb.serverTimestamp(), st:"pending"};
      if(direct) inv.d=direct.d;
      if(game.m) inv.m=game.m;
      if(game.w) inv.w=game.w;
      await fb.setDoc(fb.doc(fb.db,"invites",uid),inv);
      fb.setDoc(fb.doc(fb.db,"fichas",uid),{inv:fb.increment(1)},{merge:true}).catch(()=>{});
      tried.add(to);
      out={who, to, d:direct?direct.d:null, end:Date.now()+WIN};
      out.unsub=fb.onSnapshot(fb.doc(fb.db,"invites",uid), s=>{ const st=s.exists()&&s.data().st; if(out && st && st!=="pending") answered(st); }, ()=>{});
      out.timer=setInterval(tickOut,1000);
      msgOut(""); $("ivWaitT").textContent=t().ivWaitT(who); stage("wait"); tickOut(); beat();
    }catch(e){ msgOut(t().ivFail); stage(game?"done":"opts"); }
    finally{ $("ivSend").disabled=false; $("ivAgain").disabled=false; }
  }
  function tickOut(){
    if(!out) return;
    const s=Math.max(0,Math.ceil((out.end-Date.now())/1000));
    $("ivWaitBar").style.width=(s*1000/WIN*100)+"%"; $("ivWaitBar").classList.toggle("low",s<=10);
    $("ivCancel").textContent=`${t().ivCancel} · ${t().ivSecs(s)}`;
    if(s<=0){ fb.updateDoc(fb.doc(fb.db,"invites",uid),{st:"expired"}).catch(()=>{}); answered("expired"); }
  }
  function stopOut(){ if(!out) return; clearInterval(out.timer); if(out.unsub) out.unsub(); const o=out; out=null; beat(); return o; }
  function answered(st){
    const o=stopOut(); if(!o) return;
    if(st==="accepted"){
      msgOut(t().ivYesOut(o.who)); const gm=game; game=null;
      const pid=`${gm.k}-${gm.lang}-${gm.n}`;
      (async()=>{
        // el duelo: se crea con la primera partida, o se le suma la revancha
        let id=o.d;
        try{
          if(id){
            const s=await fb.getDoc(fb.doc(fb.db,"duels",id));
            await fb.updateDoc(s.ref,{games:[...s.data().games, pid], last:uid});
          } else {
            id=`${uid}_${pid}`;
            await fb.setDoc(fb.doc(fb.db,"duels",id),{p:[uid,o.to], games:[pid], last:uid, at:fb.serverTimestamp()});
          }
          watchDuel(id);
        }catch(e){ id=null; }
        setTimeout(()=>{ if(dOut.open) dOut.close(); setLang(gm.lang); Reg.playInvite(gm.g, gm.k, gm.n, id, gm.m); }, 700);
      })();
      return;
    }
    if(st==="cancelled") return;
    msgOut(st==="declined" ? t().ivNoOut(o.who) : st==="busy" ? t().ivBusyOut(o.who) : t().ivExpOut(o.who));
    stage("done");
  }
  function cancelOut(){
    if(out){ fb.updateDoc(fb.doc(fb.db,"invites",uid),{st:"cancelled"}).catch(()=>{}); stopOut(); }
    if(dOut.open) dOut.close();
  }
  function solo(){ const gm=game; game=null; dOut.close(); if(gm){ setLang(gm.lang); Reg.playInvite(gm.g, gm.k, gm.n, null, gm.m); } }
  $("ivAgain").hidden=false;

  // ---------- quien recibe ----------
  function listen(){
    const q=fb.query(fb.collection(fb.db,"invites"), fb.where("to","==",uid), fb.where("st","==","pending"));
    fb.onSnapshot(q, s=>{
      s.docChanges().forEach(ch=>{
        if(ch.type==="added") receive(ch.doc.id, ch.doc.data());
        // quien invitó la canceló o la dio por vencida
        else if(ch.type==="removed" && inc && inc.id===ch.doc.id && !inc.answering) late();
      });
    }, ()=>{});
  }
  function receive(id, d){
    const left=WIN-(now()-(d.at ? d.at.toMillis() : now()));
    if(left<=2000) return;
    if(inc || out || anyOpen() || !want || Reg.busyList().includes(d.g))
      return fb.updateDoc(fb.doc(fb.db,"invites",id),{st:"busy"}).catch(()=>{});
    inc={id, d, end:Date.now()+left};
    const playing=Reg.busyList().length>0;
    inc.frozen=Reg.freeze();
    $("ivInT").textContent=(d.d ? t().ivRematchIn : t().ivInT)(d.name, describe(d));
    $("ivInFz").textContent=playing ? t().ivFz : "";
    $("ivYes").disabled=$("ivNo").disabled=false;
    dIn.showModal(); $("ivYes").focus();
    inc.timer=setInterval(tickIn,1000); tickIn(); beat();
  }
  function tickIn(){
    if(!inc) return;
    const s=Math.max(0,Math.ceil((inc.end-Date.now())/1000));
    $("ivInBar").style.width=(s*1000/WIN*100)+"%"; $("ivInBar").classList.toggle("low",s<=10);
    $("ivInLeft").textContent=t().ivSecs(s);
    if(s<=0) endIn(true);
  }
  function endIn(thaw){
    if(!inc) return; clearInterval(inc.timer);
    // se descongelan solo las partidas que congeló esta invitación
    if(thaw) inc.frozen.forEach(Reg.thaw);
    inc=null; if(dIn.open) dIn.close();
    beat();
  }
  function late(){
    if(!inc) return; clearInterval(inc.timer);
    $("ivInLeft").textContent=t().ivLate; $("ivYes").disabled=$("ivNo").disabled=true;
    setTimeout(()=>{ if(inc){ inc.answering=true; endIn(true); } }, 1500);
  }
  async function accept(){
    if(!inc || inc.answering) return;
    inc.answering=true; const {id,d}=inc;
    try{ await fb.updateDoc(fb.doc(fb.db,"invites",id),{st:"accepted"}); }
    catch(e){ inc.answering=false; return late(); }
    const duel=d.d || `${id}_${d.k}-${d.lang}-${d.n}`;
    endIn(false); watchDuel(duel);
    setLang(d.lang); Reg.playInvite(d.g, d.k, d.n, duel, d.m);
  }
  function decline(){
    if(!inc || inc.answering) return;
    inc.answering=true;
    fb.updateDoc(fb.doc(fb.db,"invites",inc.id),{st:"declined"}).catch(()=>{});
    endIn(true);
  }
  function setWant(v){ want=v; store.set("rodo-inv", v?"1":"0"); $("ivRecv").checked=v; beat(); }

  // "Sopa de letras de 15×15, con pistas, en inglés"
  function describe(o){
    const T0=t(), p=[];
    if(o.g==="sopa"){ const s=o.k==="sopa"?"media":String(o.k).slice(4); p.push(T0.ivSize(SOPA_N[s]||12)); p.push(o.m==="c"?T0.ivWithClues:T0.ivWithWords); }
    if(o.g==="semilla" && o.w) p.push(T0.ivWords(o.w));
    p.push(T0.ivIn[o.lang]||"");
    return T0.ivDesc(T0.gName[o.g], p.filter(Boolean));
  }

  // ---------- duelos ----------
  // D[id] = {doc, scores:{partida:{uid:resultado}}, at:{partida:ms}, opp, who}
  const D={}, shown={};
  function watchDuel(id, tries=0){
    if(!fb || !id || (D[id] && D[id].doc)) return;
    const x=D[id]=D[id]||{scores:{}, at:{}, subs:{}};
    // el duelo puede no existir todavía (lo crea quien invitó): se reintenta unos segundos
    x.unsub=fb.onSnapshot(fb.doc(fb.db,"duels",id), s=>{
      if(!s.exists()) return;
      x.doc=s.data(); x.opp=x.doc.p.find(u=>u!==uid);
      // el apodo del rival se relee con cada cambio del duelo (puede ponérselo recién en la revancha)
      fb.getDoc(fb.doc(fb.db,"names",x.opp)).then(n=>{ x.who=(n.exists()&&n.data().name)||t().ivSomeone; redraw(id); }).catch(()=>{});
      x.doc.games.forEach(pid=>{
        if(x.subs[pid]) return;
        x.subs[pid]=fb.onSnapshot(fb.collection(fb.db,"scores",pid,"players"), qs=>{ const sc={}; qs.forEach(d=>sc[d.id]=d.data()); x.scores[pid]=sc; redraw(id); }, ()=>{});
        fb.getDoc(fb.doc(fb.db,"puzzles",pid)).then(p=>{ const a=p.exists()&&p.data().at; x.at[pid]=a&&a.toMillis?a.toMillis():now(); redraw(id); }).catch(()=>{});
      });
      redraw(id);
    }, ()=>{ delete D[id]; if(tries<8) setTimeout(()=>watchDuel(id, tries+1), 1500); });
  }
  function outcome(x, pid){
    const S=x.scores[pid]||{}, k=pid.split("-")[0], late=x.at[pid] ? now()-x.at[pid] > 16*60000 : false;
    const w=duelWinner(k, S[uid], S[x.opp], late);
    return w==="a" ? "me" : w==="b" ? "op" : w;
  }
  function redraw(id){ Object.entries(shown).forEach(([g,s])=>{ if(s.id===id) drawDuel(g); }); }
  function drawDuel(g){
    const s=shown[g], x=s && D[s.id], c=Reg.cur(g);
    if(!x || !x.doc || !c || `${c.k}-${c.lang}-${c.n}`!==s.pid) return;
    const T0=t(), who=x.who||T0.ivSomeone, el=Reg.slot(g,"wduel");
    let w=0, l=0, ti=0;
    x.doc.games.forEach(pid=>{ const r=outcome(x,pid); if(r==="me") w++; else if(r==="op") l++; else if(r==="tie") ti++; });
    const r=outcome(x, s.pid);
    const now1 = r==="me" ? T0.duWon : r==="op" ? T0.duLost(who) : r==="tie" ? T0.duTie : r==="void" ? T0.duVoid : T0.duWaitOpp(who);
    const mine=x.doc.last!==uid;
    el.hidden=false;
    el.innerHTML=`<span class="sc">${esc(T0.duScore(w,l,who))}</span>`+
      `<p>${esc(T0.duPlayed(x.doc.games.length)+(ti?T0.duTies(ti):"")+" · "+now1)}</p>`+
      (mine ? `<button class="duRe">${esc(T0.duRematch)}</button>` : `<p>${esc(T0.duTheirPick(who))}</p>`);
    el.setAttribute("aria-label", T0.duTitle(who));
    const b=el.querySelector(".duRe");
    if(b) b.addEventListener("click",()=>openOut({to:x.opp, who, d:s.id}));
  }
  Reg.onDuel=(g, id, pid)=>{ shown[g]={id, pid}; watchDuel(id); drawDuel(g); };

const User = (()=>{
  const AV=["🦊","🐻","🐂","🐋","🦉","🐢","🦁","🐙","🐝","🦄","🚀","⚡","🔑","🧠","🌕","🍕","🎲","🛠️","🎩","🌵"];
  const HOURS=[24,48];   // primer y segundo bloqueo; el tercero queda hasta que lo destrabe la administración
  let fb=null, mode="new", av="", busy=false;
  const t=()=>T[lang], dlg=$("userDlg");
  const msgU=s=>{ $("uMsg").textContent=s||""; };
  const key=v=>v.trim().replace(/\s+/g," ").toLowerCase();
  const hasPin=()=>!!(fb && fb.auth.currentUser && fb.auth.currentUser.email);
  async function emailOf(k, v){
    const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(k+"|"+v));
    return [...new Uint8Array(b)].slice(0,20).map(x=>x.toString(16).padStart(2,"0")).join("")+"@jugadores.rodo.es";
  }
  const rnd=()=>[...crypto.getRandomValues(new Uint8Array(6))].map(x=>x.toString(36).padStart(2,"0")).join("").slice(0,10);

  function head(){
    const n=Reg.nick(), b=$("userBtn");
    b.textContent = n ? `${Reg.av()||"🙂"} ${n}` : t().uBtn;
    b.classList.toggle("set", !!n);
  }
  function avs(){
    $("uAvs").innerHTML=AV.map(a=>`<button type="button" data-a="${a}" aria-pressed="${a===av}">${a}</button>`).join("");
  }
  function render(){
    const T0=t(), me=mode==="me", nw=mode==="new", old=mode==="old", setPin=me && !hasPin();
    $("uT").textContent = me ? T0.uTitleMe : nw ? T0.uTitleNew : T0.uTitleOld;
    $("uTabs").hidden=me;
    $("uTabs").querySelectorAll("button").forEach(b=>{ b.textContent=b.dataset.t==="new"?T0.uTabNew:T0.uTabOld; b.setAttribute("aria-pressed", b.dataset.t===mode); });
    $("uNameRow").hidden=me; $("uMeName").hidden=!me;
    if(me) $("uMeName").textContent=T0.uPlaying(av||"🙂", Reg.nick());
    $("uAvRow").hidden=old;
    $("uPinRow").hidden=me && !setPin; $("uPin2Row").hidden=old || (me && !setPin);
    $("uNote").textContent = nw ? T0.uNoteNew : old ? T0.uNoteOld : setPin ? T0.uSetPinNote : "";
    $("uGo").textContent = nw ? T0.uGoNew : old ? T0.uGoOld : T0.uSavePin; $("uGo").hidden=me && !setPin;
    $("uOut").hidden=!(me && hasPin()); $("uOut").textContent=T0.uOut;
    $("uSkip").hidden=me; $("uSkip").textContent=T0.uSkip;
    ["uNameL","uAvL","uPinL","uPin2L"].forEach(id=>$(id).textContent=T0[{uNameL:"uName",uAvL:"uAv",uPinL:"uPin",uPin2L:"uPin2"}[id]]);
    $("uX").setAttribute("aria-label",T0.ivClose); $("uX").textContent="×";
    avs();
  }
  async function open(){
    await Reg.ready; fb=Reg.fb(); if(!fb || dlg.open) return;
    mode = Reg.nick() ? "me" : "new"; av=Reg.av()||AV[Math.floor(Math.random()*AV.length)];
    $("uName").value=""; $("uPin").value=""; $("uPin2").value=""; msgU(""); render();
    dlg.showModal(); (mode==="me" ? $("uX") : $("uName")).focus();
  }
  // vincula el jugador actual a una cuenta "nombre + PIN" (sin perder lo jugado)
  async function linkPin(name, pin){
    const k=key(name), ver=rnd();
    const r=await Reg.setNick(name, {av, ver}); if(r!=="ok") return Reg.nickMsg(r);
    const cred=fb.EmailAuthProvider.credential(await emailOf(k,ver), pin);
    try{ await fb.linkWithCredential(fb.auth.currentUser, cred); }
    catch(e){ return e.code==="auth/operation-not-allowed" ? t().uOff : t().uFail; }
    return "";
  }
  async function create(){
    const name=$("uName").value, pin=$("uPin").value, pin2=$("uPin2").value;
    if(!name.trim()) return msgU(t().ivNeedNick);
    if(!/^\d{6}$/.test(pin)) return msgU(t().uBadPin);
    if(pin!==pin2) return msgU(t().uPinDiff);
    const err=await linkPin(name, pin); if(err) return msgU(err);
    msgU(t().uDone); head(); setTimeout(()=>dlg.open&&dlg.close(), 900);
  }
  async function savePin(){
    const pin=$("uPin").value, pin2=$("uPin2").value;
    if(!/^\d{6}$/.test(pin)) return msgU(t().uBadPin);
    if(pin!==pin2) return msgU(t().uPinDiff);
    const err=await linkPin(Reg.nick(), pin); if(err) return msgU(err);
    msgU(t().uDone); render();
  }
  const fmtDate=ms=>new Date(ms).toLocaleString(lang==="en"?"en-US":"es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  async function signin(){
    const name=$("uName").value, pin=$("uPin").value, k=key(name);
    if(!k) return msgU(t().ivNeedNick);
    if(!/^\d{6}$/.test(pin)) return msgU(t().uBadPin);
    const ns=await fb.getDoc(fb.doc(fb.db,"nicks",k));
    if(!ns.exists() || !ns.data().v) return msgU(t().uNoUser);
    const lref=fb.doc(fb.db,"pinlocks",k);
    let lk=await fb.getDoc(lref); lk=lk.exists() ? lk.data() : {fails:0,level:0,at:null};
    if(lk.level>=3) return msgU(t().uLockedAdmin);
    // bloqueado: empezó en "at" y dura 24 h (primer bloqueo) o 48 h (segundo)
    const until=lk.level>=1 && lk.fails===0 && lk.at && lk.at.toMillis ? lk.at.toMillis()+HOURS[lk.level-1]*3600000 : 0;
    if(until>Date.now()) return msgU(t().uLocked(fmtDate(until)));
    try{
      await fb.signInWithEmailAndPassword(fb.auth, await emailOf(k, ns.data().v), pin);
      // entró: se borra el contador de intentos y se recarga la página con su usuario
      try{ await fb.setDoc(lref,{fails:0,level:0,at:null}); }catch(e){}
      msgU(t().uWelcome); setTimeout(()=>location.reload(), 400);
    }catch(e){
      if(e.code==="auth/too-many-requests") return msgU(t().uTooMany);
      if(e.code==="auth/operation-not-allowed") return msgU(t().uOff);
      if(!/invalid-credential|wrong-password|invalid-login|user-not-found/.test(e.code||"")) return msgU(t().uFail);
      // PIN mal: suma un intento; al tercero, bloqueo
      try{
        const nx=await fb.runTransaction(fb.db, async tx=>{
          const s=await tx.get(lref), o=s.exists() ? s.data() : {fails:0,level:0,at:null};
          // al tercer intento fallido sube el nivel de bloqueo y la hora la pone el servidor
          tx.set(lref, o.fails<2 ? {fails:o.fails+1, level:o.level, at:o.at||null} : {fails:0, level:o.level+1, at:fb.serverTimestamp()});
          return {o};
        });
        if(nx.o.fails<2) return msgU(t().uWrong(2-nx.o.fails));
        const lvl=nx.o.level+1;
        if(lvl>=3){ notifyAdmin(name); return msgU(t().uLockedAdmin); }
        return msgU(t().uLockNow(HOURS[lvl-1]));
      }catch(err){ return msgU(t().uFail); }
    }
  }
  function notifyAdmin(name){
    fetch("https://formsubmit.co/ajax/claudia@rodo.es",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({_subject:"RODO ₿ Games: usuario bloqueado", _template:"table", _captcha:"false",
        Usuario:name, Detalle:"Tercer bloqueo por PIN incorrecto (9 intentos fallidos). Queda bloqueado hasta que se destrabe desde el panel de administración.", Idioma:lang})}).catch(()=>{});
  }
  async function signout(){
    if(!confirm(t().uOutWarn)) return;
    await fb.signOut(fb.auth); location.reload();
  }
  async function go(){
    if(busy) return; busy=true; $("uGo").disabled=true;
    try{ if(mode==="new") await create(); else if(mode==="old") await signin(); else await savePin(); }
    finally{ busy=false; $("uGo").disabled=false; }
  }
  $("userBtn").addEventListener("click",open);
  $("uX").addEventListener("click",()=>dlg.close());
  $("uSkip").addEventListener("click",()=>dlg.close());
  $("uOut").addEventListener("click",signout);
  $("uGo").addEventListener("click",go);
  ["uName","uPin","uPin2"].forEach(id=>$(id).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }));
  $("uTabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; mode=b.dataset.t; msgU(""); render(); });
  $("uAvs").addEventListener("click",async e=>{
    const b=e.target.closest("button"); if(!b) return; av=b.dataset.a; avs();
    if(mode==="me"){ const r=await Reg.setNick(Reg.nick(), {av}); msgU(r==="ok" ? t().uAvSaved : Reg.nickMsg(r)); head(); render(); }
  });
  (async()=>{ await Reg.ready; fb=Reg.fb(); head(); })();
  return {open, texts:()=>{ head(); if(dlg.open) render(); }};
})();

const Admin = (()=>{
  const ADMIN_EMAIL="claudia@rodo.es";
  let A=null, rows=[], names={};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const ms=x=> x&&x.toMillis ? x.toMillis() : (typeof x==="number" ? x : null);
  const DAY=86400000;
  const hrs=t=>{ const m=Math.round(t/60000); return m<60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; };
  const pct=(a,b)=> b ? Math.round(100*a/b)+"%" : "–";
  const median=a=>{ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), i=b.length>>1; return b.length%2?b[i]:(b[i-1]+b[i])/2; };
  const dt=t=> t ? new Date(t).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "–";
  const NAMES={acrostico:"Acróstico",ahorcado:"Ahorcado",sopa:"Sopa mediana",sopachica:"Sopa chica",sopagrande:"Sopa grande",criptograma:"Criptograma",anagrama:"Anagrama",semilla:"Semilla perdida",esbip:"¿Está en la lista?",placa:"Placa de acero"};

  const table=(head,body)=>`<div class="atabw"><table class="atab"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

  async function show(){
    setTitle("Administración");
    $("admBody").innerHTML=""; $("admErr").textContent="";
    A = await Promise.race([ADMIN_READY, new Promise(r=>setTimeout(()=>r(null),9000))]);
    if(!A){ $("admLogin").style.display=""; $("admIn").disabled=true; $("admErr").textContent="La administración solo funciona en el sitio publicado."; return; }
    A.onState(u=>{
      const ok = u && u.email===ADMIN_EMAIL;
      $("admLogin").style.display = ok ? "none" : "";
      document.querySelectorAll("#view-admin .bar button").forEach(b=>b.style.display = ok ? "" : "none");
      $("admWho").textContent = ok ? u.email : "";
      if(u && !ok){ $("admErr").textContent=`${u.email} no tiene acceso.`; A.logout(); }
      if(ok && view==="admin") load();
      testBtn();
    });
  }
  // "este navegador es de prueba": marca al jugador anónimo de este mismo navegador
  function testBtn(){ $("admTest").textContent = Reg.isTester() ? "Navegador de prueba: SÍ" : "Marcar este navegador como de prueba"; }
  $("admTest").addEventListener("click",async()=>{
    await Reg.ready; const u=Reg.uid(); if(!A||!u) return;
    const on=!Reg.isTester(), ref=A.doc(A.db,"testers",u);
    try{ if(on) await A.setDoc(ref,{at:A.serverTimestamp()}); else await A.deleteDoc(ref); Reg.setTester(on); testBtn(); load(); }
    catch(e){ $("admErr").textContent="No se pudo cambiar el modo prueba: "+(e.code||e.message); }
  });
  async function load(){
    $("admBody").innerHTML=`<p class="m">Cargando datos…</p>`;
    let F,S,C,N,X,DU,LE,PL;
    try{
      [F,S,C,N,X,DU,LE,PL]=await Promise.all([
        A.getDocs(A.collection(A.db,"fichas")), A.getDocs(A.collectionGroup(A.db,"players")),
        A.getDocs(A.collection(A.db,"counters")), A.getDocs(A.collection(A.db,"names")), A.getDocs(A.collection(A.db,"testers")), A.getDocs(A.collection(A.db,"duels")), A.getDocs(A.collection(A.db,"learned")), A.getDocs(A.collection(A.db,"pinlocks"))]);
    }catch(e){ $("admBody").innerHTML=`<p class="m">No se pudieron leer los datos (${esc(e.code||e.message)}). ¿Están publicadas las reglas nuevas?</p>`; return; }
    const now=Date.now(), fichas={}, testers=new Set(); names={};
    X.forEach(d=>testers.add(d.id));
    N.forEach(d=>names[d.id]=d.data().name);
    F.forEach(d=>{ if(testers.has(d.id)) return; const x=d.data(); fichas[d.id]={first:ms(x.first), last:ms(x.last), seen:x.seen||{}, plays:x.plays||{}, inv:x.inv||0}; });
    rows=[]; S.forEach(d=>{ if(testers.has(d.id)) return; const x=d.data(), id=d.ref.parent.parent.id, [k,L,n]=id.split("-");
      const r={u:d.id, k:x.g||k, L, n:+n, ok:!!x.ok, s:x.s||0, h:x.h||0, e:x.e, c:x.c||0, m:x.m, ms:x.ms||0, at:ms(x.at)};
      r.sc=scoreOf(r.k, r); rows.push(r); });
    const counters={}; C.forEach(d=>counters[d.id]=d.data().count||0);

    // jugadores: los que tienen ficha más los que solo dejaron resultados (anteriores a la ficha)
    const P={};
    const pl=u=>P[u]=P[u]||{u, first:null, last:null, res:0, ok:0, time:0, games:new Set(), days:new Set(), seen:0, inv:0, dj:0, dg:0};
    Object.entries(fichas).forEach(([u,f])=>{ const p=pl(u); p.first=f.first; p.last=f.last; p.inv=f.inv; p.seen=Object.values(f.seen).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0); });
    rows.forEach(r=>{ const p=pl(r.u); p.res++; if(r.ok) p.ok++; p.time+=Math.min(r.ms, 3*3600000); p.games.add(r.k);
      if(r.at){ p.days.add(new Date(r.at).toDateString()); p.first=Math.min(p.first??r.at, r.at); p.last=Math.max(p.last??r.at, r.at); } });
    // duelos: cada partida la gana quien sacó más puntos (o quien la terminó, si el otro no)
    const byPid={}; rows.forEach(r=>{ const key=`${r.k}-${r.L}-${r.n}`; (byPid[key]=byPid[key]||{})[r.u]=r; });
    let duels=0, duelGames=0;
    DU.forEach(d=>{ const x=d.data(), [a,b]=x.p||[]; if(!a||!b||testers.has(a)||testers.has(b)) return; duels++;
      (x.games||[]).forEach(pid=>{ const R=byPid[pid]||{}, w=duelWinner(pid.split("-")[0], R[a], R[b], true); if(w==="void") return;
        duelGames++; pl(a).dj++; pl(b).dj++; if(w==="a") pl(a).dg++; if(w==="b") pl(b).dg++; }); });
    const players=Object.values(P);
    const inviters=players.filter(p=>p.inv>0).length, invTot=players.reduce((a,p)=>a+p.inv,0);
    // "¿Aprendiste alguna palabra nueva?": tildes por juego e idioma (sobre las partidas terminadas)
    const learnBy={}; let learnYes=0, learnDuel=0;
    LE.forEach(d=>{ const x=d.data(); if(!x.yes||testers.has(x.u)) return; learnYes++; if(x.duel) learnDuel++;
      const [k,L]=String(x.p).split("-"); learnBy[`${k}-${L}`]=(learnBy[`${k}-${L}`]||0)+1; });
    const since=d=>players.filter(p=>p.first && now-p.first<d*DAY).length;
    const active=d=>players.filter(p=>p.last && now-p.last<d*DAY).length;
    const totalTime=players.reduce((a,p)=>a+p.time,0);
    const returning=players.filter(p=>p.days.size>=2).length;
    const seenTot=players.reduce((a,p)=>a+p.seen,0);
    const created=Object.values(counters).reduce((a,b)=>a+b,0);

    let h=`<div class="kpis">
      <div class="kpi"><b>${players.length}</b><span>jugadores (navegadores)</span></div>
      <div class="kpi"><b>${active(1)}</b><span>activos hoy · ${active(7)} en 7 días</span></div>
      <div class="kpi"><b>${since(7)}</b><span>nuevos en 7 días · ${since(30)} en 30</span></div>
      <div class="kpi"><b>${returning}</b><span>volvieron otro día (${pct(returning,players.length)})</span></div>
      <div class="kpi"><b>${rows.length}</b><span>partidas terminadas · ${pct(rows.filter(r=>r.ok).length,rows.length)} con éxito</span></div>
      <div class="kpi"><b>${hrs(totalTime)}</b><span>de juego en total · ${players.length?hrs(totalTime/players.length):"–"} por jugador</span></div>
      ${testers.size?`<div class="kpi"><b>${testers.size}</b><span>navegador${testers.size>1?"es":""} de prueba, fuera de estas cuentas</span></div>`:""}
      <div class="kpi"><b>${learnYes}</b><span>dijeron que aprendieron algo · ${pct(learnYes,rows.length)} de las partidas${learnDuel?` · ${learnDuel} en duelo`:""}</span></div>
      <div class="kpi"><b>${invTot}</b><span>invitaciones a jugar · de ${inviters} jugador${inviters===1?"":"es"}</span></div>
      <div class="kpi"><b>${duels}</b><span>duelos · ${duelGames} partidas en duelo</span></div>
      <div class="kpi"><b>${created}</b><span>partidas numeradas creadas</span></div>
      <div class="kpi"><b>${pct(rows.length,seenTot)}</b><span>de las partidas abiertas se terminan</span></div>
    </div>`;

    // por juego e idioma
    const G={};
    rows.forEach(r=>{ const key=`${r.k}-${r.L}`; (G[key]=G[key]||[]).push(r); });
    Object.keys(counters).forEach(k=>G[k]=G[k]||[]);
    const gl=Object.keys(G).sort();
    h+=`<h2>Por juego</h2>`+table(["Juego","Idioma","Creadas","Terminadas","Jugadores","Éxito","Tiempo mediano","Puntos mediana","Sin errores ni ayudas","Aprendieron algo"],
      gl.map(key=>{ const r=G[key], [k,L]=key.split("-"), okr=r.filter(x=>x.ok);
        return [esc(gname(k)), L.toUpperCase(), counters[key]||0, r.length, new Set(r.map(x=>x.u)).size, pct(okr.length,r.length),
          okr.length?fmt(median(okr.map(x=>x.ms))):"–", r.length?Math.round(median(r.map(x=>x.sc.pts))):"–", pct(r.filter(x=>!x.sc.pen).length,r.length), learnBy[key]?`${learnBy[key]} (${pct(learnBy[key],r.length)})`:"–"]; }));

    // actividad: últimos 30 días
    const days=[...Array(30)].map((_,i)=>{ const d=new Date(now-(29-i)*DAY); return d.toDateString(); });
    const perDay=days.map(d=>rows.filter(r=>r.at && new Date(r.at).toDateString()===d).length), mx=Math.max(1,...perDay);
    h+=`<h2>Partidas terminadas por día (últimos 30 días)</h2><div class="bars">${perDay.map((v,i)=>`<div style="height:${v/mx*100}%" title="${days[i]}: ${v}"></div>`).join("")}</div>
      <div class="barlbl"><span>hace 30 días</span><span>máximo: ${mx===1&&!perDay.some(Boolean)?0:mx}</span><span>hoy</span></div>`;
    // horario
    const perH=[...Array(24)].map((_,i)=>rows.filter(r=>r.at && new Date(r.at).getHours()===i).length), mh=Math.max(1,...perH);
    h+=`<h2>¿A qué hora juegan? (hora de Argentina de este navegador)</h2><div class="bars">${perH.map((v,i)=>`<div style="height:${v/mh*100}%" title="${i} h: ${v}"></div>`).join("")}</div>
      <div class="barlbl"><span>0 h</span><span>12 h</span><span>23 h</span></div>`;

    // jugadores más activos
    const top=[...players].sort((a,b)=>(b.res-a.res)||((b.last||0)-(a.last||0))).slice(0,25);
    h+=`<h2>Jugadores más activos</h2>`+table(["Jugador","Terminadas","Con éxito","Abiertas","Juegos","Días","Tiempo","Invitó","Duelo: jugadas / ganadas","Primera vez","Última vez"],
      top.map(p=>[esc(names[p.u]||("anónimo "+p.u.slice(0,6))), p.res, p.ok, p.seen||"–", p.games.size, p.days.size, hrs(p.time), p.inv||"–", p.dj?`${p.dj} / ${p.dg}`:"–", dt(p.first), dt(p.last)]));

    // partidas con más jugadores
    const PZ={}; rows.forEach(r=>{ const key=`${r.k}-${r.L}-${r.n}`; (PZ[key]=PZ[key]||[]).push(r); });
    const topz=Object.entries(PZ).sort((a,b)=>b[1].length-a[1].length).slice(0,10);
    h+=`<h2>Partidas con más jugadores</h2>`+table(["Partida","Jugadores","Éxito","Mejor tiempo"],
      topz.map(([key,r])=>{ const [k,L,n]=key.split("-"), okr=r.filter(x=>x.ok); return [`${esc(gname(k))} ${L.toUpperCase()} #${n}`, r.length, pct(okr.length,r.length), okr.length?fmt(Math.min(...okr.map(x=>x.ms))):"–"]; }));

    // usuarios bloqueados por PIN incorrecto (nivel 1: 24 h, 2: 48 h, 3: hasta destrabarlo acá)
    const locks=[]; PL.forEach(d=>{ const x=d.data(); if(x.level>=1) locks.push({k:d.id, level:x.level, at:ms(x.at)}); });
    if(locks.length){
      locks.sort((a,b)=>b.level-a.level||(b.at||0)-(a.at||0));
      h+=`<h2>Usuarios bloqueados por PIN</h2>`+table(["Usuario","Bloqueos","Desde","Hasta",""],
        locks.map(l=>[esc(l.k), l.level, dt(l.at), l.level>=3?"hasta que lo destrabes":dt((l.at||0)+(l.level===1?24:48)*3600000),
          `<button class="unlock" data-k="${esc(l.k)}">Destrabar</button>`]));
      h+=`<p class="m small">Destrabar vuelve a cero los intentos. Si la persona olvidó el PIN, no se puede recuperar: tiene que crear un usuario nuevo con otro nombre.</p>`;
    }

    // últimos resultados
    const last=[...rows].filter(r=>r.at).sort((a,b)=>b.at-a.at).slice(0,20);
    h+=`<h2>Últimos resultados</h2>`+table(["Cuándo","Jugador","Partida","Resultado","Tiempo","Ayudas/errores"],
      last.map(r=>[dt(r.at), esc(names[r.u]||("anónimo "+r.u.slice(0,6))), `${esc(gname(r.k))} ${r.L.toUpperCase()} #${r.n}`, r.ok?"✓":"✗", fmt(r.ms), r.h]));
    h+=`<p class="m small">Cada "jugador" es un navegador: la misma persona en el celular y en la computadora cuenta como dos, y quien borra los datos del navegador empieza de nuevo.</p>`;
    $("admBody").innerHTML=h;
  }
  function csv(){
    const head=["jugador","apodo","juego","idioma","partida","exito","aciertos","ayudas","errores","tiempo_seg","penalidad_seg","puntos","fecha"];
    const q=s=>`"${String(s||"").replace(/"/g,'""')}"`;
    const lines=[head.join(",")].concat(rows.map(r=>[r.u,q(names[r.u]),r.k,r.L,r.n,r.ok?1:0,r.s,r.sc.h,r.sc.e,Math.round(r.ms/1000),Math.round(r.sc.pen),r.sc.pts,r.at?new Date(r.at).toISOString():""].join(",")));
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"})); a.download="rodo-games-resultados.csv"; a.click();
  }
  $("admIn").addEventListener("click",async()=>{ $("admErr").textContent=""; try{ await A.login(); }catch(e){ $("admErr").textContent="No se pudo entrar: "+(e.code||e.message); } });
  $("admOut").addEventListener("click",()=>A&&A.logout());
  $("admReload").addEventListener("click",()=>load());
  $("admCsv").addEventListener("click",csv);
  $("admBody").addEventListener("click",async e=>{
    const b=e.target.closest(".unlock"); if(!b||!A) return;
    try{ await A.setDoc(A.doc(A.db,"pinlocks",b.dataset.k),{fails:0,level:0,at:null}); load(); }
    catch(err){ $("admErr").textContent="No se pudo destrabar: "+(err.code||err.message); }
  });
  return {show};
})();
const GAMES = { acrostico:Acro, ahorcado:Hang, sopa:Sopa, criptograma:Cripto, anagrama:Ana, semilla:Seed, esbip:IsBip, placa:Plate };
function applyTexts(){
  const t=T[lang];
  document.documentElement.lang=lang;
  $("menuBtn").textContent=t.menuBtn; $("menuIntro").textContent=t.menuIntro; $("privNote").textContent=t.privNote;
  $("cAcroName").textContent=t.acroName; $("cAcroDesc").textContent=t.acroDesc;
  $("cHangName").textContent=t.hangName; $("cHangDesc").textContent=t.hangDesc;
  $("cSopaName").textContent=t.sopaName; $("cSopaDesc").textContent=t.sopaDesc;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  Acro.texts(); Hang.texts(); Sopa.texts(); applyTexts2(); Reg.texts(); Buzon.texts(); Live.texts(); User.texts();
  $("adminLink").textContent=t.adminLink;
  if(view==="admin") return setTitle("Administración");
  setTitle({menu:t.menuTitle, acrostico:t.acroTitle, ahorcado:t.hangTitle, sopa:t.sopaTitle, criptograma:t.cripTitle, anagrama:t.anaTitle, semilla:t.seedTitle, esbip:t.bipTitle, placa:t.plateTitle}[view]);
}
const HIDDEN = new Set(["esbip","placa"]); // juegos BIP39 ocultos por ahora
function route(){
  const h=location.hash.replace("#","");
  view = h==="admin" ? "admin" : (GAMES[h] && !HIDDEN.has(h) ? h : "menu");
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id==="view-"+view));
  $("menuBtn").style.display = view==="menu" ? "none" : "";
  applyTexts();
  if(GAMES[view]) Reg.enter(view);
  if(view==="admin") Admin.show();
  window.scrollTo(0,0);
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.lang===lang) return;
  lang=b.dataset.lang; store.set("rodo-lang",lang);
  applyTexts();
  // el juego abierto pasa al último número del nuevo idioma; los demás, al abrirlos
  if(GAMES[view]) Reg.enter(view, true);
}));
// cambio de idioma por una invitación: no reemplaza las partidas en curso ni las congeladas
function setLang(L){
  if(!L || L===lang) return;
  lang=L; store.set("rodo-lang",lang); applyTexts();
}
window.addEventListener("hashchange",route);
route();
</script>
<script type="module">
// Firebase: autenticación anónima + Firestore
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut, EmailAuthProvider, linkWithCredential, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, collectionGroup, query, where, getDocs, onSnapshot, runTransaction, serverTimestamp, arrayUnion, increment, updateDoc, deleteDoc, getCountFromServer, Timestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
try {
  // Firebase Hosting publica la configuración del proyecto en esta ruta: no hace falta copiarla al código
  const res = await fetch("/__/firebase/init.json");
  if (!res.ok) throw new Error("Sin configuración de Firebase (¿no está publicado en Firebase Hosting?)");
  const cfg = await res.json();
  const app = initializeApp(cfg);
  // administración: app separada, para que entrar con Google no reemplace la identidad anónima del jugador
  try{
    const aapp = initializeApp(cfg, "admin"), aauth = getAuth(aapp), prov = new GoogleAuthProvider();
    prov.setCustomParameters({ login_hint: "claudia@rodo.es", prompt: "select_account" });
    window.__adminResolve({ db: getFirestore(aapp), collection, collectionGroup, getDocs, doc, setDoc, deleteDoc, serverTimestamp,
      login: () => signInWithPopup(aauth, prov), logout: () => signOut(aauth), onState: cb => onAuthStateChanged(aauth, cb) });
  }catch(e){ window.__adminResolve(null); }
  const auth = getAuth(app);
  const db = getFirestore(app);
  // si en este navegador ya entró alguien (anónimo o con usuario y PIN) sigue siendo ese; si no, jugador anónimo nuevo
  const user = await new Promise((resolve, reject) => {
    const off = onAuthStateChanged(auth, u => { off(); if (u) resolve(u); else signInAnonymously(auth).then(c => resolve(c.user)).catch(reject); });
  });
  window.__fbResolve({ db, uid: user.uid, doc, getDoc, setDoc, collection, collectionGroup, query, where, getDocs, onSnapshot, runTransaction, serverTimestamp, arrayUnion, increment, updateDoc, deleteDoc, getCountFromServer, Timestamp, writeBatch,
    auth, EmailAuthProvider, linkWithCredential, signInWithEmailAndPassword, signOut });
} catch (e) {
  console.warn("RODO Games sin servidor:", e.message);
  window.__fbResolve(null); window.__adminResolve && window.__adminResolve(null);
}
</script>
