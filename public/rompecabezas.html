<style>
:root{
  --bg:#E6EAEE; --paper:#F7F8F9; --ink:#1A1E23; --muted:#5B6672; --line:#B9C2CB;
  --btc:#F7931A; --btc-soft:#FDE6C6; --ok:#2E7D4F; --bad:#C2362B; --cell-bg:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171B; --paper:#1C2026; --ink:#E9ECEF; --muted:#98A3AE; --line:#3A424C;
    --btc-soft:#4A3215; --ok:#5CC48A; --bad:#F07167; --cell-bg:#11141A;
  }
}
:root[data-theme="dark"]{
  --bg:#14171B; --paper:#1C2026; --ink:#E9ECEF; --muted:#98A3AE; --line:#3A424C;
  --btc-soft:#4A3215; --ok:#5CC48A; --bad:#F07167; --cell-bg:#11141A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px; background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.86;z-index:-1}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 110px}
@media (max-width:640px){ .wrap{padding-top:64px} }
header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:inline-block;color:var(--ink);line-height:0;margin-bottom:12px;text-decoration:none}
.brand .logo{display:block;height:30px;width:auto}
@media (max-width:640px){ .brand .logo{height:24px} }
h1{margin:0;font-size:clamp(2.2rem,8.5vw,4.2rem);line-height:.95;font-weight:800;letter-spacing:-.03em}
h2{font-size:1.5rem;margin:34px 0 10px;font-weight:800;letter-spacing:-.01em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--cell-bg)}
.lang button{border:0;border-radius:0;padding:10px 12px;background:transparent}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button,.btn{
  font:inherit;font-weight:600;cursor:pointer;border-radius:10px;padding:10px 16px;
  border:1px solid var(--line);background:var(--cell-bg);color:var(--ink);text-decoration:none;display:inline-block;
}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--btc)!important;border-color:var(--btc)!important;color:#1A1E23!important}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--btc);outline-offset:2px}
.intro{color:var(--muted);margin:0 0 6px;max-width:62ch;font-size:1.05rem}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}
.badge{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:600}
.badge.o{background:var(--btc);border-color:var(--btc);color:#1A1E23}

/* ---------- Productos ---------- */
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.prod{display:flex;flex-direction:column;border-radius:14px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.prod.sel{border-color:var(--btc);box-shadow:0 0 0 2px var(--btc-soft)}
.shot{all:unset;cursor:zoom-in;display:flex;align-items:center;justify-content:center;background:#0E1013;height:300px;position:relative}
.shot img{max-width:100%;max-height:100%;display:block}
.shot:focus-visible{outline:3px solid var(--btc);outline-offset:-3px}
.shot .zoom{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:2px 8px;font-size:.8rem}
.pbody{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1}
.pnum{font:700 .8rem "IBM Plex Mono",ui-monospace,monospace;color:var(--btc)}
.prod h3{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.prod p{margin:0;color:var(--muted);font-size:.95rem}
.specs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0}
.pdf{display:flex;flex-direction:column;gap:4px;margin:6px 0 2px}
.pdfdl{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;font-weight:600;color:inherit;text-decoration:none}
.pdfdl:hover{border-color:#F7931A}.pdf small{font-size:.76rem;color:var(--muted);line-height:1.35}
.specs span{font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.buy{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font:700 1.15rem "IBM Plex Mono",ui-monospace,monospace}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--cell-bg)}
.qty button{border:0;border-radius:0;padding:8px 14px;font-size:1.1rem;line-height:1;background:transparent}
.qty output{min-width:2.2em;text-align:center;font:700 1rem "IBM Plex Mono",ui-monospace,monospace}
.add{width:100%}

/* ---------- Pedido ---------- */
.order{border-radius:14px;background:var(--paper);border:1px solid var(--line);padding:18px}
.sum{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:.95rem}
.sum td{padding:6px 0;border-bottom:1px solid var(--line)}
.sum td:last-child{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;white-space:nowrap}
.sum tr.tot td{font-weight:800;border-bottom:0;font-size:1.05rem}
.empty{color:var(--muted);margin:0 0 14px}
form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){ .two{grid-template-columns:1fr} }
label,.lab{display:grid;gap:4px;font-weight:600;font-size:.95rem}
label small,.lab small{font-weight:400;color:var(--muted)}
input,textarea{font:400 1rem "Bricolage Grotesque",system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--cell-bg);color:var(--ink);width:100%}
textarea{min-height:5em;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--btc);box-shadow:0 0 0 2px var(--btc-soft)}
input:user-invalid{border-color:var(--bad)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--cell-bg);cursor:pointer;font-weight:600}
.seg label:has(input:checked){border-color:var(--btc);background:var(--btc-soft)}
.seg input{width:auto;margin:0;accent-color:var(--btc)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.fine{color:var(--muted);font-size:.85rem;margin:0}
.msg{margin:0;font-size:.95rem;min-height:1.4em}
.msg.bad{color:var(--bad)}
.cup{display:flex;gap:8px;flex-wrap:wrap}
.cup input{flex:1;min-width:10em;text-transform:uppercase;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cupmsg{margin:2px 0 0;font-size:.9rem;font-weight:400}
.cupmsg.ok{color:var(--ok)} .cupmsg.bad{color:var(--bad)}
.sum tr.dsc td{color:var(--ok)}
.sum s{color:var(--muted);display:block;font-size:.85rem;font-weight:400}
.payb code.addr{word-break:break-all;font-size:.85rem}
.paystat{font-weight:700;margin:8px 0 4px}
.qr{width:220px;max-width:100%;margin:10px 0;background:#fff;border-radius:10px;padding:6px}.qr svg{display:block;width:100%;height:auto}.paystat.ok{color:var(--ok)}

/* ---------- Confirmación ---------- */
.done{border-radius:14px;background:var(--paper);border:2px solid var(--btc);padding:20px}
.done h3{margin:0 0 4px;font-size:1.5rem;font-weight:800}
.code{font:700 1.2rem "IBM Plex Mono",ui-monospace,monospace;background:var(--btc-soft);padding:2px 8px;border-radius:6px}
.payb{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--cell-bg)}
.payb b{display:block;margin-bottom:4px}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy code{font:500 .95rem "IBM Plex Mono",ui-monospace,monospace;word-break:break-all}
.copy button{padding:4px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- Barra fija ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.cartbar[hidden]{display:none}
.cartbar span{font-weight:600}

/* ---------- Lightbox ---------- */
dialog.lb{padding:0;border:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100%}
dialog.lb::backdrop{background:rgba(0,0,0,.88)}
.lbin{width:100%;height:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 8px 16px}
.lbin img{max-width:none;width:min(1280px,100%);height:auto;display:block;margin:auto}
.lbx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:2}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;text-align:center}
footer a{color:inherit}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={ get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };
let lang = store.get("rodo-lang")==="en" ? "en" : "es";
const qty = Object.fromEntries(PRODUCTS.map(p=>[p.id,0]));
const qs = new URLSearchParams(location.search).get("p");      // ?p=bip39 preselecciona uno
if(qs && qty[qs]!==undefined) qty[qs]=1;
const ars = n => "$ " + n.toLocaleString("es-AR") + " ARS";
const count = () => Object.values(qty).reduce((a,b)=>a+b,0);
// ---------- Código de descuento (coupons/{CÓDIGO}, lo define la administración) ----------
let coupon=null;                                               // {code, d} una vez aplicado
const curPay = () => (document.querySelector("input[name=pay]:checked")||{}).value || "btc";
const fmtDay = ms => new Date(ms).toLocaleDateString(lang==="en"?"en-GB":"es-AR",{day:"numeric",month:"short",year:"numeric"});
function couponProblem(c){                                     // por qué no vale hoy, o "" si está vigente
  const t=T[lang], now=Date.now();
  if(!c.on) return t.cupOff;
  if(c.max && c.used>=c.max) return t.cupUsed;
  if(c.from && now<c.from) return t.cupSoon(fmtDay(c.from));
  if(c.until && now>=c.until) return t.cupExp;
  return "";
}
function calc(){
  const sub=count()*CFG.PRICE_ARS, t=T[lang]; let disc=0, why="";
  if(coupon){
    const c=coupon.d, appl=PRODUCTS.filter(p=>qty[p.id] && c.prods.includes(p.id)).reduce((a,p)=>a+qty[p.id]*CFG.PRICE_ARS,0);
    why=couponProblem(c);
    if(!why && !c.pays.includes(curPay())) why=t.cupPay(c.pays.map(x=>t.payNames[x]).join(" o "));
    if(!why && !appl) why=t.cupProds(PRODUCTS.filter(p=>c.prods.includes(p.id)).map(p=>p[lang].name).join(", "));
    if(!why) disc = c.type==="pct" ? Math.round(appl*c.value/100) : Math.min(c.value, appl);
  }
  return {sub, disc, total:sub-disc, why};
}
const totalARS = () => calc().total;
function cupMsg(){
  const t=T[lang], el=$("cupMsg");
  if(!coupon) return;
  const k=calc(), c=coupon.d;
  if(k.why){ el.className="cupmsg bad"; el.textContent=k.why; return; }
  el.className="cupmsg ok";
  el.textContent = t.cupOk(coupon.code, c.type==="pct"?`${c.value}%`:ars(c.value), c.until?fmtDay(c.until-1):"");
}
async function applyCoupon(){
  const t=T[lang], el=$("cupMsg");
  if(coupon){ coupon=null; $("fCup").value=""; $("fCup").disabled=false; el.textContent=""; texts(); return; }
  const code=$("fCup").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length<3){ el.className="cupmsg bad"; el.textContent=t.cupNo; return; }
  el.className="cupmsg"; el.textContent=t.cupChecking; $("cupBtn").disabled=true;
  try{
    const fb=await FB; if(!fb) throw new Error("sin servidor");
    const snap=await fb.getDoc(fb.doc(fb.db,"coupons",code));
    if(!snap.exists()){ el.className="cupmsg bad"; el.textContent=t.cupNo; }
    else{
      const d=snap.data(), why=couponProblem(d);
      if(why){ el.className="cupmsg bad"; el.textContent=why; }
      else{ coupon={code, d}; $("fCup").value=code; $("fCup").disabled=true; texts(); }
    }
  }catch(err){ console.warn("Código:",err); el.className="cupmsg bad"; el.textContent=t.cupNet; }
  $("cupBtn").disabled=false;
}
$("cupBtn").addEventListener("click",applyCoupon);
$("fCup").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); applyCoupon(); } });
document.querySelectorAll("input[name=pay]").forEach(r=>r.addEventListener("change",()=>renderSummary()));
// ---------- Pago on-chain: cotización (CriptoYa) y seguimiento en mempool.space ----------
async function btcRate(){                                      // pesos por 1 BTC: mediana del precio de compra de los exchanges; 0 si falla
  try{
    const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),6000);
    const j=await (await fetch(CFG.PRICE_URL,{signal:ctl.signal})).json(); clearTimeout(tm);
    const v=Object.values(j||{}).map(x=>x && (+x.totalAsk || +x.ask)).filter(x=>x>1e6).sort((a,b)=>a-b);
    return v.length ? Math.round(v[Math.floor(v.length/2)]) : 0;
  }catch(e){ console.warn("Cotización:",e); return 0; }
}
const btcOf = sats => (sats/1e8).toFixed(8);
const bip21 = o => `bitcoin:${o.addr}${o.sats?`?amount=${btcOf(o.sats)}`:""}`;   // URI de pago (BIP21): la billetera lee dirección y monto
async function payQr(o){
  try{ const {qrSvg}=await import("/js/qr.js"), el=$("payQr"); if(el) el.innerHTML=qrSvg(bip21(o)); }catch(e){ console.warn("QR:",e); }
}
let payTimer=null;
function watchPay(o){
  clearInterval(payTimer); if(!o || !o.addr) return;
  const check=async()=>{
    const el=$("payStat"); if(!el || !lastOrder || lastOrder.code!==o.code){ clearInterval(payTimer); return; }
    try{
      const j=await (await fetch(`${CFG.MEMPOOL}/api/address/${o.addr}`)).json(), t=T[lang];
      const chain=(j.chain_stats||{}).funded_txo_sum||0, mem=(j.mempool_stats||{}).funded_txo_sum||0, got=chain+mem;
      let txt = !got ? t.payWait : chain>=got && (!o.sats || chain>=o.sats) ? t.payOk(chain) : t.paySeen(got);
      if(got && o.sats && got<o.sats*0.995) txt+=t.payShort(got, o.sats);
      el.textContent=txt; el.className="paystat"+(chain && (!o.sats || chain>=o.sats) ? " ok" : "");
      if(chain && (!o.sats || chain>=o.sats)) clearInterval(payTimer);
    }catch(e){}
  };
  check(); payTimer=setInterval(check, 20000);
}
const lines = L => PRODUCTS.filter(p=>qty[p.id]).map(p=>`${qty[p.id]} × ${p[L].name}`).join(", ");

              : `<button class="primary add" data-d="1">${esc(t.add)}</button>`}

function renderSummary(){
  const t=T[lang], n=count(), k=calc();
  $("sumBox").innerHTML = n
    ? `<table class="sum"><tbody>${PRODUCTS.filter(p=>qty[p.id]).map(p=>`<tr><td>${qty[p.id]} × ${esc(p[lang].name)}</td><td>${ars(qty[p.id]*CFG.PRICE_ARS)}</td></tr>`).join("")}
        ${k.disc?`<tr class="dsc"><td>${esc(t.discount(coupon.code))}</td><td>− ${ars(k.disc)}</td></tr>`:""}
        <tr class="tot"><td>${t.total}</td><td>${k.disc?`<s>${ars(k.sub)}</s> `:""}${ars(k.total)}</td></tr></tbody></table>`
    : `<p class="empty">${esc(t.empty)}</p>`;
  $("cartbar").hidden = !n || !$("done").hidden;

function texts(){
  const t=T[lang];
  document.documentElement.lang=lang;
  $("title").textContent=t.title; $("backBtn").textContent=t.back; $("footBack").textContent=t.footBack; $("intro").textContent=t.intro;
  $("badges").innerHTML=(CFG.PRESALE?`<span class="badge o">${esc(t.presale)}</span>`:"")+t.badges.map(b=>`<span class="badge">${esc(b)}</span>`).join("");
  ["orderT","nameL","mailL","phoneL","placeL","shipL","shipA","shipB","shipC","payL","payA","payB","noteL","optL","fine","send","cartGo","cupL","cupBtn"].forEach(k=>$(k).textContent=t[k]);
  $("lbX").textContent=t.close; $("cupOpt").textContent=t.optL; $("cupBtn").textContent=coupon?t.cupRemove:t.cupBtn;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  renderProducts(); renderSummary();
  if(lastOrder){ renderDone(lastOrder); payQr(lastOrder); }

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; store.set("rodo-lang",lang); texts(); }));

$("prods").addEventListener("click",e=>{
  const shot=e.target.closest(".shot");
  if(shot){ const p=PRODUCTS.find(x=>x.img===shot.dataset.img); $("lbImg").src=`/img/rompecabezas/${shot.dataset.img}.webp`; $("lbImg").alt=p[lang].name; $("lb").showModal(); $("lbIn").scrollTop=0; return; }

// ---------- Pedido ----------
const ALPH="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const newCode=()=>"R"+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>ALPH[b%ALPH.length]).join("");
const FB = new Promise(r=>{ window.__fbResolve=r; setTimeout(()=>r(null),8000); });
let sending=false, lastOrder=null;

$("form").addEventListener("submit", async e=>{
  e.preventDefault(); if(sending) return;
  const t=T[lang], msg=$("msg"); msg.className="msg bad";
  if($("fHp").value) return;                                   // robot
  if(!count()) { msg.textContent=t.errEmpty; $("prods").scrollIntoView({block:"start"}); return; }
  const f={ name:$("fName").value.trim(), email:$("fMail").value.trim(), phone:$("fPhone").value.trim(), place:$("fPlace").value.trim(),
    ship:document.querySelector("input[name=ship]:checked").value, pay:document.querySelector("input[name=pay]:checked").value, note:$("fNote").value.trim() };
  if(f.name.length<2 || !f.email || f.phone.length<6 || f.place.length<2){ msg.textContent=t.errFields; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)){ msg.textContent=t.errMail; $("fMail").focus(); return; }
  sending=true; $("send").disabled=true; $("send").textContent=t.sending; msg.className="msg"; msg.textContent="";
  const items={}; PRODUCTS.forEach(p=>{ if(qty[p.id]) items[p.id]=qty[p.id]; });
  const k=calc(), cup = k.disc ? coupon.code : "";
  const order={ ...f, items, sub:k.sub, disc:k.disc, cup, total:k.total, lang, code:newCode() };
  let saved=false, mailed=false;
  // 1) base de datos (la ve el panel de administración). Con código, el pedido y el uso del código se escriben juntos o no se escribe nada.
  // En bitcoin, el pedido toma la siguiente dirección libre (payaddr/{n}) y sube el contador btcidx/main en la misma escritura.
  const fb=await FB;
  const rate = fb && f.pay==="btc" ? await btcRate() : 0;
  if(fb){
    for(let i=0;i<4 && !saved;i++){
      const data={ items, name:f.name, email:f.email, phone:f.phone, place:f.place, ship:f.ship, pay:f.pay,
             note:f.note, sub:order.sub, total:order.total, lang, u:fb.uid, st:"nuevo", at:fb.serverTimestamp() };
      let onc=null;
      if(f.pay==="btc"){
        try{
          const ix=await fb.getDoc(fb.doc(fb.db,"btcidx","main"));
          if(ix.exists()){ const n=ix.data().n, a=await fb.getDoc(fb.doc(fb.db,"payaddr",String(n)));
            if(a.exists() && a.data().a) onc={ai:n, addr:a.data().a, sats: rate ? Math.round(order.total/rate*1e8) : 0, rate}; }
        }catch(e){ console.warn("Dirección:",e); }
      }
      try{
        if(cup || onc){
          const b=fb.writeBatch(fb.db);
          b.set(fb.doc(fb.db,"orders",order.code),{...data, ...(cup?{cup, disc:order.disc}:{}), ...(onc||{})});
          if(cup) b.update(fb.doc(fb.db,"coupons",cup),{used:fb.increment(1), last:order.code});
          if(onc) b.update(fb.doc(fb.db,"btcidx","main"),{n:fb.increment(1), last:order.code});
          await b.commit();
        } else await fb.setDoc(fb.doc(fb.db,"orders",order.code),data);
        saved=true; if(onc) Object.assign(order, onc);
      }
      catch(err){
        console.warn("Pedido:",err);
        if(err.code!=="permission-denied") break;
        if(cup){                                                // ¿se agotó o venció el código mientras completaba el formulario?
          let gone=true; try{ const sn=await fb.getDoc(fb.doc(fb.db,"coupons",cup)); if(sn.exists()){ coupon.d=sn.data(); gone=!!couponProblem(coupon.d); } }catch(e){}
          if(gone){ coupon=null; $("fCup").value=""; $("fCup").disabled=false; texts();
            sending=false; $("send").disabled=false; $("send").textContent=t.send; msg.className="msg bad"; msg.textContent=t.cupGone; $("sumBox").scrollIntoView({block:"center"}); return; }
        }
        order.code=newCode();                                   // código repetido, u otro pedido tomó la misma dirección a la vez: se reintenta con la siguiente
      }
    }
  }
  if(cup && !saved){                                            // sin guardar el uso del código no se manda el pedido con descuento
    sending=false; $("send").disabled=false; $("send").textContent=t.send; msg.className="msg bad"; msg.textContent=t.errSend; return;
  }
  // 2) aviso por mail
  try{
    const r=await fetch(`https://formsubmit.co/ajax/${CFG.MAIL_TO}`,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({ _subject:`🧩 Pedido ${order.code}: ${lines("es")} (${ars(order.total)})`, _replyto:f.email, _template:"table", _captcha:"false",
        Pedido:order.code, Rompecabezas:lines("es"), Subtotal:ars(order.sub), Descuento:cup?`${cup}: − ${ars(order.disc)}`:"-", Total:ars(order.total), Nombre:f.name, Email:f.email, Telefono:f.phone, Lugar:f.place,
        Entrega:{correo:"Correo Argentino (cotizar envío)", dot:"Retiro en Shopping DOT", labitconf:"Retiro en LABITCONF"}[f.ship]||f.ship, Pago:f.pay==="btc"?(order.addr?"Bitcoin on-chain":"Bitcoin (sin dirección on-chain libre: pasarle una o cobrar por Lightning)"):"Pesos",
        Direccion:order.addr||"-", Monto_BTC:order.addr?(order.sats?`${btcOf(order.sats)} BTC (${order.sats} sats, 1 BTC = ${ars(order.rate)})`:"sin cotización: pasárselo"):"-", Comentarios:f.note||"-",
        Idioma:lang, Guardado:saved?"sí, en el panel":"NO (solo este mail)" })});
    mailed=r.ok;
  }catch(err){ console.warn("Mail:",err); }
  sending=false; $("send").disabled=false; $("send").textContent=t.send;
  if(!saved && !mailed){ msg.className="msg bad"; msg.textContent=t.errSend; return; }
  order.lines={es:lines("es"), en:lines("en")};
  lastOrder=order; coupon=null; $("fCup").value=""; $("fCup").disabled=false; $("cupMsg").textContent=""; renderDone(order); watchPay(order); payQr(order);
  $("orderBox").hidden=true; $("done").hidden=false; renderSummary();
  $("done").scrollIntoView({block:"start"});
});

function renderDone(o){
  const t=T[lang], tot=ars(o.total);
  const btc=`<div class="payb"><b>₿ ${esc(t.payBtc)}</b><div class="copy"><code>${esc(CFG.LN_ADDRESS)}</code><button data-copy="${esc(CFG.LN_ADDRESS)}">${t.copy}</button></div><p class="fine">${esc(t.payBtcN(tot))}</p></div>`;
  const arsb=`<div class="payb"><b>$ ${esc(t.payArs)}</b><div class="copy"><code>${esc(CFG.ARS_ALIAS)}</code><button data-copy="${esc(CFG.ARS_ALIAS)}">${t.copy}</button></div><p class="fine">${esc(t.payArsN(tot))}</p></div>`;
  const onc = o.addr ? `<div class="payb"><b>₿ ${esc(t.payOn)}</b><p class="fine">${esc(t.payTo)}</p>
      <div class="copy"><code class="addr">${esc(o.addr)}</code><button data-copy="${esc(o.addr)}">${t.copy}</button></div>
      ${o.sats ? `<p class="fine">${esc(t.payAmt)}</p><div class="copy"><code>${btcOf(o.sats)} BTC</code><button data-copy="${btcOf(o.sats)}">${t.copy}</button></div><p class="fine">${esc(t.payRate(ars(o.rate), tot))}</p>`
               : `<p class="fine">${esc(t.payNoRate(tot))}</p>`}
      <div class="qr" id="payQr" role="img" aria-label="${esc(t.payQr)}"></div>
      <p><a class="btn" href="${esc(bip21(o))}">${esc(t.payOpen)}</a></p>
      <p class="paystat" id="payStat" aria-live="polite">${esc(t.payWait)}</p>
      <p class="fine"><a href="${CFG.MEMPOOL}/address/${esc(o.addr)}" target="_blank" rel="noopener">${esc(t.payMempool)}</a></p></div>` : btc;
  const wa = CFG.WHATSAPP ? `<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(t.waMsg(o.code,o.lines[lang]))}">${esc(t.wa)}</a>` : "";
  $("done").innerHTML=`<h3>${esc(t.doneT)}</h3>
    <p>${esc(t.doneCode)} <span class="code">${o.code}</span> · ${esc(o.lines[lang])} · ${o.disc?`<s>${ars(o.sub)}</s> `:""}<b>${tot}</b>${o.disc?` · ${esc(t.discount(o.cup))}: − ${ars(o.disc)}`:""}</p>
    <p>${esc(t.doneP)}</p>${o.pay==="btc" ? onc+arsb : arsb+(o.addr?"":btc)}
    <div class="row">${wa}<button id="againBtn">${esc(t.again)}</button></div>`;
}
$("done").addEventListener("click",async e=>{
  const c=e.target.closest("button[data-copy]");
  if(c){ try{ await navigator.clipboard.writeText(c.dataset.copy); c.textContent=T[lang].copied; setTimeout(()=>c.textContent=T[lang].copy,1500); }catch(err){} return; }
  if(e.target.id==="againBtn"){ lastOrder=null; PRODUCTS.forEach(p=>qty[p.id]=0); $("form").reset(); $("done").hidden=true; $("orderBox").hidden=false; texts(); $("prods").scrollIntoView({block:"start"}); }
});

texts();
</script>
<script type="module">
// Firebase: el mismo jugador anónimo de los juegos; el pedido se guarda en orders/{código} (solo lo lee la administración)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, writeBatch, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
try{
  const res=await fetch("/__/firebase/init.json"); if(!res.ok) throw new Error("sin configuración");
  const app=initializeApp(await res.json()), auth=getAuth(app);
  const user=await new Promise((ok,ko)=>{ const off=onAuthStateChanged(auth,u=>{ off(); if(u) ok(u); else signInAnonymously(auth).then(c=>ok(c.user)).catch(ko); }); });
  window.__fbResolve({ db:getFirestore(app), uid:user.uid, doc, setDoc, getDoc, writeBatch, increment, serverTimestamp });
}catch(e){ console.warn("Rompecabezas sin servidor:", e.message); window.__fbResolve(null); }
</script>
